# NovaBank gateway in the "preprod" environment (Cloud Run, Knative service YAML).
# Deployed by cloudbuild.yaml with:  gcloud run services replace deploy/environments/preprod.yaml
# ${PROJECT_ID}, ${PROJECT_NUMBER}, ${REGION} and ${IMAGE} are filled in at deploy time.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: novabank-gateway-preprod
  labels:
    app: novabank
    env: preprod
    component: gateway
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: novabank
        env: preprod
        component: gateway
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: novabank-run-preprod@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: gateway
          image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "preprod"
            - name: AUTH_SERVICE_URL
              value: "https://novabank-auth-preprod-${PROJECT_NUMBER}.${REGION}.run.app"
            - name: ACCOUNT_SERVICE_URL
              value: "https://novabank-account-preprod-${PROJECT_NUMBER}.${REGION}.run.app"
            - name: TRANSACTION_SERVICE_URL
              value: "https://novabank-transaction-preprod-${PROJECT_NUMBER}.${REGION}.run.app"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://novabank-ui-preprod-${PROJECT_NUMBER}.${REGION}.run.app"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: novabank-preprod-jwt-secret
                  key: latest
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
