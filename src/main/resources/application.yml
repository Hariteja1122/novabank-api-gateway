server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  profiles:
    default: local

novabank:
  services:
    auth-url: ${AUTH_SERVICE_URL}
    account-url: ${ACCOUNT_SERVICE_URL}
    transaction-url: ${TRANSACTION_SERVICE_URL}
  jwt:
    secret: ${JWT_SECRET}
    issuer: novabank-auth
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    environment: ${spring.profiles.active:local}

logging:
  level:
    com.novabank: INFO
