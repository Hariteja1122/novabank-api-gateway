novabank:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    transaction-url: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.novabank: DEBUG
    org.springframework.cloud.gateway: INFO
